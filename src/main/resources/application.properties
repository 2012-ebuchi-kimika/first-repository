spring.application.name=meeting-app-api

# MySQL 接続設定（既存の smart_meeting_db を指定）
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/smart_meeting_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo
spring.datasource.username=root
spring.datasource.password=root

# XML マッパーファイルの置き場所を指定
mybatis.mapper-locations=classpath:mapper/*.xml

# スネークケースをキャメルケースへ自動変換
mybatis.configuration.map-underscore-to-camel-case=true

# JSP の配置先設定
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Gemini API 設定
gemini.api.key=${GEMINI_API_KEY:YOUR_API_KEY_HERE}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent